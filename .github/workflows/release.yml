name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to validate without publishing
        required: true
        default: v1.0.0
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  verify:
    name: Release preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Validate tag and package metadata
        run: python3 scripts/check_release_metadata.py --tag "$RELEASE_TAG"

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Rust tests
        run: cargo test --workspace --lib --bins --tests --locked

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            platform: windows
            python: python
            cli_path: target/release/codeforge.exe
            tauri_args: ""
          - name: linux-x64
            os: ubuntu-22.04
            platform: linux
            python: python3
            cli_path: target/release/codeforge
            tauri_args: "--bundles appimage,deb"
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Build CLI
        run: cargo build --release --locked -p codeforge-cli

      - name: CLI smoke checks
        shell: bash
        run: |
          version="$("${{ matrix.cli_path }}" --version)"
          test "$version" = "codeforge ${RELEASE_TAG#v}"
          echo "$version"
          "${{ matrix.cli_path }}" scan fixtures --json > smoke-scan.json
          "${{ matrix.cli_path }}" review fixtures --include-fixtures --json > smoke-review.json

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Frontend lint
        working-directory: apps/desktop
        run: pnpm lint

      - name: Frontend typecheck
        working-directory: apps/desktop
        run: pnpm typecheck

      - name: Build release bundles
        working-directory: apps/desktop
        run: pnpm tauri build ${{ matrix.tauri_args }}

      - name: Normalize and package release assets
        shell: bash
        run: |
          ${{ matrix.python }} scripts/package_release_assets.py \
            --platform ${{ matrix.platform }} \
            --tag "$RELEASE_TAG" \
            --cli ${{ matrix.cli_path }} \
            --bundle-dir target/release/bundle \
            --output artifacts

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: codeforge-${{ matrix.name }}
          path: artifacts/*
          if-no-files-found: error

  publish:
    name: Publish and verify release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums from exact asset filenames
        run: python3 scripts/checksum_release_assets.py generate artifacts

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: CodeForge Engine ${{ env.RELEASE_TAG }}
          body_path: docs/releases/${{ env.RELEASE_TAG }}.md
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          make_latest: ${{ !contains(env.RELEASE_TAG, '-') }}
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*.msi
            artifacts/*.exe
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/checksums.txt

      - name: Verify published asset names and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p published
          gh release download "$RELEASE_TAG" --dir published --clobber
          python3 scripts/checksum_release_assets.py verify artifacts/checksums.txt published
