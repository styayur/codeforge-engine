name: Bug report
description: Report a reproducible defect
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal steps or repository fixture.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CodeForge version
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, tool versions, installed engines.
    validations:
      required: true
