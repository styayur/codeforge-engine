name: Feature request
description: Propose a language, engine, workflow, or protocol improvement
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Engineering problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification and safety considerations
    validations:
      required: true
