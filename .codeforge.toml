[commands.format]
program = "cargo"
args = ["fmt", "--all", "--", "--check"]
timeout_secs = 60

[commands.lint]
program = "cargo"
args = [
  "clippy",
  "--workspace",
  "--all-targets",
  "--all-features",
  "--",
  "-D",
  "warnings",
]
timeout_secs = 120

[commands.test]
program = "cargo"
args = ["test", "--workspace", "--all-targets"]
timeout_secs = 600

[commands.build]
program = "cargo"
args = ["build", "--release", "-p", "codeforge-cli"]
timeout_secs = 600

[commands.benchmark]
program = "cargo"
args = ["bench", "-p", "codeforge-fleet", "--bench", "fleet"]
timeout_secs = 900
